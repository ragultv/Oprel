name: Publish to PyPI & GitHub Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pypi-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  build-and-publish:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: oprel/webui-react/package-lock.json

      - name: Install WebUI dependencies
        working-directory: oprel/webui-react
        run: npm ci

      - name: Build WebUI static export
        working-directory: oprel/webui-react
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build and packaging tools
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade build twine

      - name: Build Python wheel and source distribution
        run: python -m build

      - name: Verify distribution archives
        run: twine check --strict dist/*

      - name: Extract package version
        id: pkg_version
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "TAG_NAME=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ${{ steps.pkg_version.outputs.TAG_NAME }}
          name: Oprel ${{ steps.pkg_version.outputs.TAG_NAME }}
          body_path: CHANGELOG.md
          files: dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
