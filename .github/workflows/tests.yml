name: Tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package with test tools
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-asyncio pytest-cov httpx

      - name: Run tests
        env:
          OPREL_SKIP_RUNTIME_DOWNLOAD: "1"
        # test_basec.py is a legacy suite that no longer matches the API.
        # The two OCR tests depend on the host GPU / optional RapidOCR install.
        run: >
          python -m pytest tests/unit tests/server tests/evaluation
          --ignore=tests/unit/test_basec.py
          --deselect tests/unit/test_vlm_ocr_service.py::test_detect_gpu_telemetry
          --deselect tests/unit/test_vlm_ocr_service.py::test_ocr_readiness_with_rapidocr
          --cov=oprel --cov-report=term -q
